<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Research — Scoutly</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef1f7">
<link rel="icon" type="image/png" href="assets/favicon.png">
<script>(function(){var u=null;try{u=sessionStorage.getItem('scoutly.user')}catch(_){return}if(!u)location.replace('login.html?mode=login')})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Tektur:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:20px}
.tc{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--ln);min-width:0;transition:border-color .2s,transform .2s}
.tc:hover{border-color:rgba(47,91,255,.4);transform:translateY(-2px)}
.tc-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(100deg,#050a1f,#0b1a52 60%,#15349e);color:#fff}
.tc-h h3{flex:1;font:500 16px/1.2 var(--D);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.tc-h span{font:500 10.5px/1 var(--M);color:rgba(214,224,255,.7)}
.tc-b{flex:1;padding:12px 16px}
.tc-b h4{margin:8px 0 6px;font:600 9.5px/1 var(--M);letter-spacing:.14em;text-transform:uppercase;color:var(--b)}
.tc-b li{padding:5px 0;font:400 12.5px/1.45 Geist,sans-serif;color:var(--sl);border-bottom:1px solid var(--ln)}.tc-b li:last-child{border-bottom:0}
.tc-f{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--ln)}
.qall{columns:2 320px;column-gap:28px}.qall li{break-inside:avoid;padding:7px 0;border-bottom:1px solid var(--ln);font:400 13px/1.45 Geist,sans-serif}
.qall a{color:var(--ink)}.qall a:hover{color:var(--b)}
</style>
</head>
<body>
<script src="assets/shell.js"></script>
<div class="main">
  <script>Shell.top()</script>
  <main class="page">
    <div class="ph">
      <p class="lbl">Content</p>
      <h1>Topic Research</h1>
      <p class="desc">Find content ideas around a topic: the subtopics people search for and the exact questions they ask Google. Each card is a possible article or section; jump straight into the Writing Assistant with it.</p>
    </div>
    <form class="qbar" id="f" novalidate>
      <div class="qf"><label for="q">Topic</label><input id="q" placeholder="e.g. running shoes" autocomplete="off"></div>
      <div class="qf sm"><label for="gl">Country</label><select id="gl"><option value="in">India</option><option value="us">United States</option><option value="gb">United Kingdom</option><option value="ae">UAE</option><option value="au">Australia</option><option value="ca">Canada</option><option value="sg">Singapore</option></select></div>
      <button class="btn p" type="submit"><svg class="i"><use href="#i-bulb"/></svg>Get content ideas</button>
    </form>
    <p class="qerr" id="err" role="alert"></p>
    <div class="loading" id="load" hidden><span class="spin"></span>Collecting what people search for…</div>
    <div id="out" hidden>
      <div class="cards" id="cards"></div>
      <section class="panel" style="margin-top:20px"><div class="panel-h"><span class="ic"><svg class="i"><use href="#i-alert"/></svg></span><div><h2>All questions</h2><p id="qP"></p></div><button class="btn sm" type="button" id="qExp" style="margin-left:auto"><svg class="i"><use href="#i-dl"/></svg>CSV</button></div><ul class="qall pad" id="qs"></ul></section>
    </div>
  </main>
</div>
<script src="assets/app.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},S=window.Scoutly,esc=S.esc,data=null;
  function run(q){$('err').textContent='';if(!q.trim()){$('err').textContent='Enter a topic.';return}
    history.replaceState(null,'','?q='+encodeURIComponent(q)+'&gl='+$('gl').value);$('out').hidden=true;$('load').hidden=false;
    S.api('/api/topics?q='+encodeURIComponent(q)+'&gl='+$('gl').value).then(function(d){data=d;
      $('cards').innerHTML=d.cards.map(function(c,i){var title=d.seed+' '+c.topic;
        return '<article class="tc"><div class="tc-h"><h3>'+esc(c.topic)+'</h3><span>'+(c.keywords.length+c.questions.length)+' searches</span></div><div class="tc-b">'+
          (c.questions.length?'<h4>Questions</h4><ul>'+c.questions.slice(0,4).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+
          (c.keywords.length?'<h4>Related searches</h4><ul>'+c.keywords.slice(0,4).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'')+
          '</div><div class="tc-f"><a class="btn sm" href="writing-assistant.html?kw='+encodeURIComponent(c.questions[0]||c.keywords[0]||title)+'"><svg class="i"><use href="#i-pen"/></svg>Write</a><button class="btn sm" type="button" data-i="'+i+'"><svg class="i"><use href="#i-plus"/></svg>Save</button></div></article>'}).join('')||'<p class="meta-note">Not enough searches around this topic. Try something broader.</p>';
      $('qP').textContent=d.questions.length+' questions people ask about “'+d.seed+'”';
      $('qs').innerHTML=d.questions.map(function(x){return '<li><a href="keyword-overview.html?q='+encodeURIComponent(x)+'">'+esc(x)+'</a></li>'}).join('')||'<li class="meta-note">No question searches found.</li>';
      $('load').hidden=true;$('out').hidden=false}).catch(function(e){$('load').hidden=true;$('err').textContent=e.message})}
  $('f').addEventListener('submit',function(e){e.preventDefault();run($('q').value)});
  $('cards').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;var c=data.cards[+b.dataset.i],ks=c.questions.concat(c.keywords);
    S.api('/api/intent?q='+encodeURIComponent(ks.join('\n'))).then(function(d){var n=S.addToList('Topic: '+data.seed,d.items.map(function(k){return {kw:k.kw,intent:k.intent,added:new Date().toISOString()}}));S.say(n+' searches saved to “Topic: '+data.seed+'”.')}).catch(function(err){S.say(err.message)})});
  $('qExp').onclick=function(){if(data)S.csv([['Question']].concat(data.questions.map(function(q){return [q]})),'scoutly-questions-'+data.seed.replace(/\W+/g,'-')+'.csv')};
  if(S.qs('gl'))$('gl').value=S.qs('gl');if(S.qs('q')){$('q').value=S.qs('q');run(S.qs('q'))}else $('q').focus();
})();
</script>
</body>
</html>
