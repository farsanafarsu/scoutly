# Render Blueprint for the Scoutly API (seo/engine.py). The live site's Cloudflare Worker forwards /api/* here.
# Standard library only, plus pymongo for the team database and anthropic for the Blog Bank's AI writing.
services:
  - type: web
    name: scoutly-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SCOUTLY_API_ONLY
        value: "1"
      # copy this generated value into Cloudflare as the API_KEY secret
      - key: SCOUTLY_PROXY_KEY
        generateValue: true
      # the team's backlinks database: a MongoDB Atlas connection string (mongodb+srv://…)
      - key: MONGODB_URI
        sync: false
      # teammates enter this once on the Backlink Manager to see and save the shared links
      - key: SCOUTLY_TEAM_KEY
        generateValue: true
      # optional: a free Google key gives PageSpeed its own quota
      - key: PAGESPEED_API_KEY
        sync: false
      # Blog Bank AI writing (an Anthropic API key); without it, saved blogs still open, edit and copy
      - key: ANTHROPIC_API_KEY
        sync: false
      # optional: the model and effort for blog writing (defaults claude-opus-5-5, medium)
      - key: SCOUTLY_AI_MODEL
        sync: false
      - key: SCOUTLY_AI_EFFORT
        sync: false
