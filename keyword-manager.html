<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Manager — Scoutly</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef1f7">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Tektur:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.km{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;margin-top:20px}
.lists{background:var(--card);border:1px solid var(--ln);align-self:start}
.lists h3{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--ln);font:600 10px/1 var(--M);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.lists button.l{display:grid;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;cursor:pointer}
.lists button.l b{font:500 14px/1.3 Geist,sans-serif;color:var(--ink);overflow-wrap:anywhere}.lists button.l span{margin-top:3px;font:400 11px/1.3 var(--M);color:var(--mu)}
.lists button.l:hover{background:#fff}.lists button.l[aria-pressed="true"]{background:var(--ink)}.lists button.l[aria-pressed="true"] b{color:#fff}.lists button.l[aria-pressed="true"] span{color:rgba(255,255,255,.7)}
.mix{display:flex;height:8px;margin-top:10px;overflow:hidden;background:var(--bg2)}.mix i{display:block;height:100%}
.mix .I{background:#17a673}.mix .N{background:var(--b)}.mix .C{background:var(--wa)}.mix .T{background:var(--cr)}
.addbox{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px;border-top:1px solid var(--ln)}
.addbox textarea{flex:1 1 260px;min-height:70px;padding:8px 10px;border:1px solid var(--ln);border-radius:3px;font:400 12.5px/1.5 var(--M);resize:vertical}
.rm{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--ln);background:#fff;cursor:pointer;color:var(--mu)}.rm:hover{color:var(--cr);border-color:var(--cr)}.rm svg{width:13px;height:13px}
@media(max-width:900px){.km{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<script src="assets/shell.js"></script>
<div class="main">
  <script>Shell.top()</script>
  <main class="page">
    <div class="ph">
      <p class="lbl">Keyword research</p>
      <h1>Keyword Manager</h1>
      <p class="desc">Collect keywords into lists from the Keyword Overview and Magic Tool, or paste your own. Lists are saved to your account, so they're here on any device you log in from.</p>
    </div>
    <div class="km">
      <aside class="lists"><h3>Lists<button class="btn sm" type="button" id="new"><svg class="i"><use href="#i-plus"/></svg>New</button></h3><div id="lists"></div></aside>
      <section class="panel" style="margin-top:0" id="detail"></section>
    </div>
  </main>
</div>
<script src="assets/app.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},S=window.Scoutly,esc=S.esc,cur=null,M={},GL=S.read('scoutly.kmGl')||'',live=false;
  S.provider().then(function(st){live=!!st.ok;if(live)render()});
  var INT={I:'Informational',N:'Navigational',C:'Commercial',T:'Transactional'};
  function mix(items){var c={I:0,N:0,C:0,T:0};items.forEach(function(k){c[k.intent]=(c[k.intent]||0)+1});var n=items.length||1;
    return '<span class="mix" aria-hidden="true">'+['I','N','C','T'].map(function(k){return c[k]?'<i class="'+k+'" style="width:'+(c[k]/n*100)+'%"></i>':''}).join('')+'</span>'}
  function render(){
    var L=S.lists(),names=Object.keys(L);
    if(cur&&!L[cur])cur=null;if(!cur)cur=names[0]||null;
    $('lists').innerHTML=names.map(function(n){return '<button class="l" type="button" data-n="'+esc(n)+'" aria-pressed="'+(n===cur)+'"><b>'+esc(n)+'</b><span>'+L[n].items.length+' keywords</span></button>'}).join('')||'<p class="pad meta-note">No lists yet.</p>';
    if(!cur){$('detail').innerHTML='<div class="empty"><span class="empty-i"><svg class="i"><use href="#i-list"/></svg></span><h3>No keyword lists yet</h3><p>Find keywords in the Keyword Magic Tool and add them here, or create a list and paste your own.</p><a class="btn sm p" href="keyword-magic.html">Open Keyword Magic Tool</a></div>';return}
    var l=L[cur],c={I:0,N:0,C:0,T:0};l.items.forEach(function(k){c[k.intent]++});
    $('detail').innerHTML='<div class="panel-h"><span class="ic"><svg class="i"><use href="#i-list"/></svg></span><div><h2>'+esc(cur)+'</h2><p>'+l.items.length+' keywords · created '+new Date(l.created).toLocaleDateString()+'</p></div><span style="margin-left:auto;display:flex;gap:8px"><button class="btn sm" type="button" id="ren">Rename</button><button class="btn sm" type="button" id="exp"><svg class="i"><use href="#i-dl"/></svg>CSV</button><button class="btn sm" type="button" id="del"><svg class="i"><use href="#i-trash"/></svg>Delete</button></span></div>'+
      '<div class="pad">'+mix(l.items)+'<div class="legend meta-note" style="margin-top:8px">'+['I','N','C','T'].map(function(k){return INT[k]+' '+c[k]}).join(' · ')+'</div></div>'+
      (live?'<div class="toolbar"><span class="sel-n">Volume, KD and CPC from DataForSEO for</span><select id="kmGl" aria-label="Country"><option value="">each keyword’s country (or US)</option><option value="in">India</option><option value="us">United States</option><option value="gb">United Kingdom</option><option value="ae">UAE</option><option value="au">Australia</option><option value="ca">Canada</option><option value="sg">Singapore</option></select></div><div id="pay" hidden style="margin:0;border-width:0 0 1px"></div>':'')+
      '<div class="dt-wrap"><table class="dt"><thead><tr><th>Keyword</th><th>Intent</th><th>Added</th><th class="n">Volume</th><th class="n">KD</th><th class="n">CPC</th><th></th></tr></thead><tbody>'+
      (l.items.map(function(k,i){return '<tr><td><a href="keyword-overview.html?q='+encodeURIComponent(k.kw)+'">'+esc(k.kw)+'</a></td><td><i class="int '+k.intent+'" title="'+INT[k.intent]+'">'+k.intent+'</i></td><td>'+(k.added?new Date(k.added).toLocaleDateString():'')+'</td><td class="n"'+(m(k)?'>'+S.fmt(m(k).vol):' style="color:var(--mu)">—')+'</td><td class="n">'+(m(k)?S.kdTag(m(k).kd):'<span style="color:var(--mu)">—</span>')+'</td><td class="n"'+(m(k)&&m(k).cpc!=null?'>$'+S.fmt(m(k).cpc,2):' style="color:var(--mu)">—')+'</td><td class="n"><button class="rm" type="button" data-i="'+i+'" aria-label="Remove '+esc(k.kw)+'"><svg class="i"><use href="#i-x"/></svg></button></td></tr>'}).join('')||'<tr><td colspan="7" class="meta-note">This list is empty. Paste keywords below.</td></tr>')+
      '</tbody></table></div><div class="addbox"><textarea id="paste" placeholder="Paste keywords, one per line"></textarea><button class="btn sm p" type="button" id="addk"><svg class="i"><use href="#i-plus"/></svg>Add keywords</button></div>';
    $('ren').onclick=function(){var n=prompt('New name for “'+cur+'”',cur);if(!n||!n.trim()||n.trim()===cur)return;var L2=S.lists();if(L2[n.trim()])return S.say('A list with that name exists.');L2[n.trim()]=L2[cur];delete L2[cur];S.saveLists(L2);cur=n.trim();render()};
    $('del').onclick=function(){if(!confirm('Delete the list “'+cur+'”?'))return;var L2=S.lists();delete L2[cur];S.saveLists(L2);cur=null;render();S.say('List deleted.')};
    if(live){$('kmGl').value=GL;$('kmGl').onchange=function(){GL=this.value;S.write('scoutly.kmGl',GL);render()};lookup(l)}
    $('exp').onclick=function(){S.csv([['Keyword','Intent','Added','Volume','KD','CPC']].concat(l.items.map(function(k){var x=m(k)||{};return [k.kw,INT[k.intent],k.added||'',x.vol,x.kd,x.cpc]})),'scoutly-'+cur.replace(/\W+/g,'-')+'.csv')};
    $('addk').onclick=function(){var raw=$('paste').value.split(/\n|,/).map(function(s){return s.trim()}).filter(Boolean);if(!raw.length)return;
      this.disabled=true;S.api('/api/intent?q='+encodeURIComponent(raw.join('\n'))).then(function(d){
        var n=S.addToList(cur,d.items.map(function(k){return {kw:k.kw,intent:k.intent,added:new Date().toISOString()}}));render();S.say(n+' keyword'+(n===1?'':'s')+' added.')})
        .catch(function(e){S.say(e.message);$('addk').disabled=false})};
  }
  function gl(k){return GL||k.gl||'us'}
  function m(k){return M[gl(k)+'|'+k.kw]}
  /* one batched lookup per country in the list; cached keywords cost nothing */
  function lookup(l){
    var by={};l.items.forEach(function(k){(by[gl(k)]=by[gl(k)]||[]).push(k.kw)});var gls=Object.keys(by);if(!gls.length)return;
    var list=cur;
    S.paid($('pay'),function(run){return Promise.all(gls.map(function(g){return S.post('/api/provider/keywords',{keywords:by[g],gl:g,run:run})})).then(function(rs){
      var o={calls:0,missing:0,cached:0,items:{}};rs.forEach(function(r,i){o.calls+=r.calls;o.missing+=r.missing;o.cached+=r.cached;Object.keys(r.items).forEach(function(kw){o.items[gls[i]+'|'+kw]=r.items[kw]})});return o})},
      function(o){var before=Object.keys(M).length;Object.keys(o.items).forEach(function(k){M[k]=o.items[k]});if(cur===list&&Object.keys(M).length!==before)render()},'volume, KD and CPC for this list');
  }
  $('lists').addEventListener('click',function(e){var b=e.target.closest('[data-n]');if(b){cur=b.dataset.n;render()}});
  $('detail').addEventListener('click',function(e){var b=e.target.closest('.rm');if(!b)return;var L=S.lists();L[cur].items.splice(+b.dataset.i,1);S.saveLists(L);render()});
  $('new').onclick=function(){var n=prompt('Name the new list');if(!n||!n.trim())return;var L=S.lists();if(L[n.trim()])return S.say('A list with that name exists.');L[n.trim()]={created:new Date().toISOString(),items:[]};S.saveLists(L);cur=n.trim();render()};
  render();
})();
</script>
</body>
</html>
